[project]
name = "player-support-copilot"
version = "0.1.0"
description = "AI support assistant for an online game: RAG over game knowledge, account-tool agent, toxicity moderation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "datasketch>=1.6",
    "langdetect>=1.0.9",
    "typer>=0.12",
]

[project.scripts]
copilot = "copilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]
eda = [
    "jupyter>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["datasketch.*", "langdetect.*", "markdownify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a running PostgreSQL (DATABASE_URL)"]

[tool.coverage.run]
source = ["copilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
